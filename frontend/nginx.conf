server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 요청을 백엔드 서비스로 프록시 (필요한 경우)
    # 실제 운영 환경에서는 Ingress가 처리하므로 여기선 기본 설정만 유지
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
