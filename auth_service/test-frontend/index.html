<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Service Test UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center p-4 md:p-8">
    <header class="mb-12 text-center">
        <h1 class="text-4xl font-extrabold text-indigo-700 tracking-tight">Auth Service MSA Test</h1>
        <p class="text-gray-500 mt-2 font-medium">FastAPI + JWT + K8s Local Test Environment</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl">
        <!-- Login Section -->
        <div id="login-section" class="bg-white p-8 rounded-2xl shadow-xl border-t-8 border-indigo-500 transition hover:shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                로그인
            </h2>
            <div class="space-y-4">
                <input id="login-email" type="email" placeholder="이메일 (test@example.com)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:bg-white outline-none transition-all">
                <input id="login-password" type="password" placeholder="비밀번호" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:bg-white outline-none transition-all">
                <button onclick="login()" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-indigo-700 shadow-lg hover:shadow-indigo-200 transition duration-200 transform active:scale-95">시작하기</button>
                <div class="relative flex items-center py-4">
                    <div class="flex-grow border-t border-gray-100"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-xs font-bold uppercase tracking-widest">Social</span>
                    <div class="flex-grow border-t border-gray-100"></div>
                </div>
                <button onclick="window.location.href='/api/v1/social/login/google'" class="w-full bg-white border border-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-xl hover:bg-gray-50 flex items-center justify-center transition duration-200 shadow-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-3"> Google 계정으로 로그인
                </button>
            </div>
        </div>

        <!-- Register Section -->
        <div class="bg-white p-8 rounded-2xl shadow-xl border-t-8 border-teal-500 transition hover:shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                계정 만들기
            </h2>
            <div class="space-y-4">
                <input id="reg-email" type="email" placeholder="이메일 주소" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-400 focus:bg-white outline-none transition-all">
                <input id="reg-fullname" type="text" placeholder="사용자 이름" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-400 focus:bg-white outline-none transition-all">
                <input id="reg-password" type="password" placeholder="비밀번호 설정" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-400 focus:bg-white outline-none transition-all">
                <button onclick="register()" class="w-full bg-teal-500 text-white font-bold py-3 px-4 rounded-xl hover:bg-teal-600 shadow-lg hover:shadow-teal-100 transition duration-200 transform active:scale-95">계정 생성</button>
            </div>
        </div>

        <!-- Profile Section -->
        <div id="profile-section" class="bg-white p-8 rounded-2xl shadow-2xl col-span-1 md:col-span-2 hidden animate-fade-in border-t-8 border-purple-500">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">인증 정보 (Protected Profile)</h2>
                    <p class="text-sm text-gray-400 font-medium">유효한 JWT가 헤더에 포함되어 있습니다.</p>
                </div>
                <button onclick="logout()" class="bg-red-50 text-red-600 px-6 py-2 rounded-xl hover:bg-red-100 font-bold transition-colors">시스템 로그아웃</button>
            </div>
            <div class="relative">
                <div class="absolute top-2 right-2 flex space-x-1">
                    <div class="w-3 h-3 bg-red-400 rounded-full"></div>
                    <div class="w-3 h-3 bg-yellow-400 rounded-full"></div>
                    <div class="w-3 h-3 bg-green-400 rounded-full"></div>
                </div>
                <pre id="profile-data" class="bg-gray-900 text-indigo-300 p-8 rounded-2xl text-sm font-mono overflow-x-auto shadow-inner leading-relaxed border border-gray-800"></pre>
            </div>
        </div>
    </div>

    <div id="message" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 p-4 rounded-2xl hidden max-w-md w-full text-center font-bold shadow-2xl transition-all duration-300 z-50"></div>

    <script>
        const API_BASE = "/api/v1";
        let token = localStorage.getItem("token");

        if (token) fetchProfile();

        async function register() {
            const email = document.getElementById('reg-email').value;
            const full_name = document.getElementById('reg-fullname').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, full_name, password })
                });
                const data = await res.json();
                showMessage(res.ok ? "가입 성공! 메일함을 확인하세요." : data.detail, res.ok);
            } catch (err) { showMessage("백엔드 서버 응답 없음 (Gateway 확인)", false); }
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const formData = new FormData();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("token", data.access_token);
                    token = data.access_token;
                    fetchProfile();
                    showMessage("환영합니다! 로그인 성공", true);
                } else { showMessage(data.detail, false); }
            } catch (err) { showMessage("로그인 시도 실패", false); }
        }

        async function fetchProfile() {
            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('profile-section').classList.remove('hidden');
                    document.getElementById('profile-data').textContent = JSON.stringify(data, null, 4);
                } else { 
                    if(token) logout(); 
                }
            } catch (err) { 
                if(token) logout();
            }
        }

        function logout() {
            localStorage.removeItem("token");
            token = null;
            document.getElementById('profile-section').classList.add('hidden');
            showMessage("보안 세션이 종료되었습니다.", true);
        }

        function showMessage(msg, isSuccess) {
            const el = document.getElementById('message');
            el.textContent = typeof msg === 'object' ? JSON.stringify(msg) : msg;
            el.className = `fixed bottom-8 left-1/2 transform -translate-x-1/2 p-4 rounded-2xl max-w-md w-full text-center font-bold shadow-2xl transition-all duration-300 z-50 ${isSuccess ? 'bg-indigo-600 text-white' : 'bg-red-600 text-white'}`;
            el.classList.remove('hidden');
            el.classList.remove('opacity-0');
            el.classList.remove('translate-y-10');
            setTimeout(() => { 
                el.classList.add('opacity-0'); 
                el.classList.add('translate-y-10');
                setTimeout(() => el.classList.add('hidden'), 500); 
            }, 4000);
        }
    </script>
</body>
</html>
