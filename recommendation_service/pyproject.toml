[project]
name = "recommendation-service"
version = "0.1.0"
description = "Unified Intelligence Service (Search + Rec) with Two-Tower Architecture"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "torch",
    "sentence-transformers",
    "numpy",
    "redis",
    "httpx",
    "python-multipart",
    "psycopg2-binary",
    "aiokafka",
    "Pillow",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
