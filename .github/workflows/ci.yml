name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'auth_service/**'
      - 'upload_service/**'
      - 'generation_service/**'
      - 'interaction_service/**'
      - 'comment_service/**'
      - 'user_service/**'
      - 'recommendation_service/**'
      - 'frontend/**'
      - 'console_frontend/**'
      - 'infra/k8s/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  # ── 1. 테스트 ────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            path: auth_service
            install: pip install -e ".[test]"
          - name: interaction-service
            path: interaction_service
            install: pip install -e ".[test]"
          - name: comment-service
            path: comment_service
            install: pip install -e ".[test]"
          - name: upload-service
            path: upload_service
            install: pip install -e ".[test]"
          - name: recommendation-service
            path: recommendation_service
            install: pip install pytest pytest-asyncio

    steps:
      - uses: actions/checkout@v4

      - name: Check if service changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - '${{ matrix.service.path }}/**'

      - name: Set up Python 3.12
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        run: ${{ matrix.service.install }}

      - name: Run tests
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        working-directory: ${{ matrix.service.path }}
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          SECRET_KEY: test-secret-key-for-ci
        run: pytest tests/ -v --tb=short

      - name: Open issue on test failure
        if: failure() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 CI Test Failed: ${{ matrix.service.name }} (${context.sha.slice(0,7)})`;
            const body = [
              `**서비스**: \`${{ matrix.service.name }}\``,
              `**커밋**: [\`${context.sha.slice(0,7)}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})`,
              `**워크플로우**: [실행 보기](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ``,
              `테스트가 실패했습니다. 위 워크플로우 링크에서 로그를 확인하세요.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci-failure'],
            });

  # ── 2. 빌드 & 푸시 ───────────────────────────────────────────────────────────
  build-and-push:
    name: Build (${{ matrix.service.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: 'auth-service',           path: 'auth_service' }
          - { name: 'upload-service',          path: 'upload_service' }
          - { name: 'generation-service',      path: 'generation_service' }
          - { name: 'interaction-service',     path: 'interaction_service' }
          - { name: 'comment-service',         path: 'comment_service' }
          - { name: 'user-service',            path: 'user_service' }
          - { name: 'recommendation-service',  path: 'recommendation_service' }
          - { name: 'frontend',                path: 'frontend' }
          - { name: 'console-frontend',        path: 'console_frontend' }
    steps:
      - uses: actions/checkout@v4

      - name: Check if service changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - '${{ matrix.service.path }}/**'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.path }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:buildcache,mode=max

  # ── 3. Infra 업데이트 ─────────────────────────────────────────────────────────
  update-infra:
    if: always()
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check which services changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service: 'auth_service/**'
            upload-service: 'upload_service/**'
            generation-service: 'generation_service/**'
            interaction-service: 'interaction_service/**'
            comment-service: 'comment_service/**'
            user-service: 'user_service/**'
            recommendation-service: 'recommendation_service/**'
            frontend: 'frontend/**'
            console-frontend: 'console_frontend/**'

      - name: Checkout Infra Repo
        uses: actions/checkout@v4
        with:
          repository: 'CREE1116/insterest-infra'
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: 'infra-repo'

      - name: Update Kubernetes manifests
        run: |
          mkdir -p infra-repo/k8s

          find infra/k8s -type f -name "*.yaml" | while read f; do
            rel="${f#infra/k8s/}"
            dest="infra-repo/k8s/$rel"
            mkdir -p "$(dirname "$dest")"
            if [[ "$(basename "$f")" != deployment*.yaml ]]; then
              cp "$f" "$dest"
            elif [ ! -f "$dest" ]; then
              cp "$f" "$dest"
            fi
          done

          cd infra-repo

          CHANGES='${{ steps.filter.outputs.changes }}'
          echo "Changes detected: $CHANGES"

          SERVICES=("auth-service" "upload-service" "generation-service" "interaction-service" "comment-service" "user-service" "recommendation-service" "frontend" "console-frontend")

          if [ -f k8s/console/deployment.yaml ]; then
            sed -i -E "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:[a-zA-Z0-9._-]+|image: ${{ secrets.DOCKERHUB_USERNAME }}/console-frontend:latest|g" k8s/console/deployment.yaml
          fi

          for service in "${SERVICES[@]}"; do
            IS_CHANGED=$(echo "$CHANGES" | jq -r ".[] | select(. == \"$service\")")

            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ -n "$IS_CHANGED" ]]; then
              echo "Updating tag for $service..."
              find . -type f -name "deployment*.yaml" -exec sed -i -E "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/$service:[a-zA-Z0-9._-]+|image: ${{ secrets.DOCKERHUB_USERNAME }}/$service:${{ github.sha }}|g" {} +
            fi
          done

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync manifests and update image tags (GitOps sync)"
            git push --force origin master
          fi
