name: Build and Push to Docker Hub

on:
  push:
    branches:
      - master
    paths:
      - 'auth_service/**'
      - 'upload_service/**'
      - 'generation_service/**'
      - 'interaction_service/**'
      - 'comment_service/**'
      - 'user_service/**'
      - 'recommendation_service/**'
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - { name: 'auth-service', path: 'auth_service' }
          - { name: 'upload-service', path: 'upload_service' }
          - { name: 'generation-service', path: 'generation_service' }
          - { name: 'interaction-service', path: 'interaction_service' }
          - { name: 'comment-service', path: 'comment_service' }
          - { name: 'user-service', path: 'user_service' }
          - { name: 'recommendation-service', path: 'recommendation_service' }
          - { name: 'frontend', path: 'frontend' }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if service changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - '${{ matrix.service.path }}/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.path }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest, ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:buildcache,mode=max
