name: Build and Push to Docker Hub

on:
  push:
    branches:
      - master
    paths:
      - 'auth_service/**'
      - 'upload_service/**'
      - 'generation_service/**'
      - 'interaction_service/**'
      - 'comment_service/**'
      - 'user_service/**'
      - 'recommendation_service/**'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch: # 수동 실행 버튼 추가

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - { name: 'auth-service', path: 'auth_service' }
          - { name: 'upload-service', path: 'upload_service' }
          - { name: 'generation-service', path: 'generation_service' }
          - { name: 'interaction-service', path: 'interaction_service' }
          - { name: 'comment-service', path: 'comment_service' }
          - { name: 'user-service', path: 'user_service' }
          - { name: 'recommendation-service', path: 'recommendation_service' }
          - { name: 'frontend', path: 'frontend' }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if service changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - '${{ matrix.service.path }}/**'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.path }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest, ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:buildcache,mode=max

  update-infra:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check which services changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service: 'auth_service/**'
            upload-service: 'upload_service/**'
            generation-service: 'generation_service/**'
            interaction-service: 'interaction_service/**'
            comment-service: 'comment_service/**'
            user-service: 'user_service/**'
            recommendation-service: 'recommendation_service/**'
            frontend: 'frontend/**'

      - name: Checkout Infra Repo
        uses: actions/checkout@v4
        with:
          repository: 'CREE1116/insterest-infra'
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: 'infra'

      - name: Update Kubernetes manifests
        run: |
          cd infra
          
          SERVICES=("auth-service" "upload-service" "generation-service" "interaction-service" "comment-service" "user-service" "recommendation-service" "frontend")
          
          for service in "${SERVICES[@]}"; do
            # Only update if the service changed or it's a manual forced run
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ steps.filter.outputs[service] }}" == "true" ]]; then
              echo "Updating tag for $service..."
              find . -type f -name "deployment*.yaml" -exec sed -i -E "s|image: .*/?$service:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/$service:${{ github.sha }}|g" {} +
            else
              echo "Skipping $service (no changes)."
            fi
          done
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update image tags for changed services (GitOps sync)"
            git push
          fi
